
name: Test Google Drive Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-drive-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out testing branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Google Drive indexing
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: python sync_google_drive.py

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-test-results
          path: |
            drive-records.json
            additional-public-records/
          retention-days: 7
