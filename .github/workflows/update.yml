
name: Update CDD Records

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Install certificate chain
        run: |
          curl --fail --location --silent --show-error \
            https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem \
            -o /tmp/root-yr.pem
          cat /tmp/root-yr.pem >> "$(python -m certifi)"

      - name: Collect CDD documents
        run: python collect.py

      - name: Save updated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records.json
          if ! git diff --cached --quiet; then
            git commit -m "Update CDD records"
            git push
          fi
