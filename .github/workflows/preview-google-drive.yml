
name: Preview Google Drive Search

on:
  workflow_dispatch:
  push:
    branches:
      - google-drive-documents
    paths:
      - '.github/workflows/preview-google-drive.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Check out testing branch
        uses: actions/checkout@v4

      - name: Package test website
        run: |
          mkdir -p preview
          cp index.html app.js records.json drive-records.json preview/
          cp -r additional-public-records preview/
          cd preview
          zip -r ../google-drive-search-preview.zip .

      - name: Upload preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-search-preview
          path: google-drive-search-preview.zip
          retention-days: 7
